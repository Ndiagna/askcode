name: Prepare CI dependencies
description: Set up Python and PHP and install the locked project and CI dependencies
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Set up PHP and Composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.5"
        tools: composer:v2

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('php-parser/composer.json', 'php-parser/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r requirements.txt -e .

    - name: Install PHP dependencies
      shell: bash
      run: composer install --working-dir=php-parser --no-interaction --prefer-dist

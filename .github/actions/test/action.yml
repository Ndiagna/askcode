name: Test and coverage
description: Run the Python test suite and publish the coverage report
runs:
  using: composite
  steps:
    - name: Run tests with coverage
      shell: bash
      run: pytest --cov=askcode --cov-report=term-missing --cov-report=xml

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        if-no-files-found: ignore
